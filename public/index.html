<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Quality Report</title><style>
*{box-sizing:border-box}body{margin:0;background:#0e1523;color:#f2f6ff;font:15px system-ui,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:32px auto;padding:0 20px}h1{font-size:30px;margin:0 0 6px}.muted{color:#a5b3c8}.panel{background:#1a2639;border:1px solid #32445e;border-radius:14px;padding:22px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{padding:16px;border-radius:10px;background:#101b2c}.stat b{display:block;font-size:28px}.stat span{color:#a5b3c8;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,a.btn{border:0;border-radius:9px;background:#4379ed;color:white;font:inherit;font-weight:700;padding:12px 17px;text-decoration:none;cursor:pointer}select{background:#101b2c;border:1px solid #51617a;color:white;border-radius:8px;padding:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.item{background:#101b2c;border:1px solid #334862;border-radius:10px;overflow:hidden}.item img{width:100%;height:170px;object-fit:contain;background:#0a1220}.body{padding:14px}.name{overflow-wrap:anywhere;font-weight:700}.small{font-size:12px;color:#a5b3c8;overflow-wrap:anywhere}.pill{display:inline-block;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:800;background:#314158}.FAIL{background:#6e2833}.REVIEW{background:#72582b}.PASS{background:#23513c}.ERROR{background:#58394e}#message{color:#f6c577}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><h1>AI Image Quality Report</h1><p class="muted">Read-only report dashboard. Add images to the project's images folder and run <code>npm run check</code> in the terminal.</p><section class="panel"><div class="toolbar"><button id="refresh">Refresh Report</button><a class="btn" href="/api/report.pdf">Download PDF Report</a><select id="filter"><option value="ALL">All images</option><option value="FAIL">Defected only</option><option value="REVIEW">Review only</option><option value="PASS">Passed only</option><option value="ERROR">Errors only</option></select></div><p id="message"></p><p id="updated" class="muted"></p></section><section class="panel"><div class="stats"><div class="stat"><span>Checked</span><b id="total">0</b></div><div class="stat"><span>PASS</span><b id="pass">0</b></div><div class="stat"><span>FAIL</span><b id="fail">0</b></div><div class="stat"><span>REVIEW</span><b id="review">0</b></div><div class="stat"><span>ERROR</span><b id="error">0</b></div></div><p id="cost" class="muted"></p></section><section class="panel"><h2>Image Results</h2><div id="cards" class="cards"></div></section></main><script>
const $=id=>document.getElementById(id);let report={results:[]};function render(){const s=report.summary||{};for(const k of ['total','pass','fail','review','error'])$(k).textContent=s[k]||0;$('cost').textContent='Estimated API usage: $'+Number(s.cost||0).toFixed(4);$('updated').textContent=report.updatedAt?'Last updated: '+new Date(report.updatedAt).toLocaleString():'No report yet';$('cards').replaceChildren();const filter=$('filter').value;const rows=report.results.filter(r=>filter==='ALL'||r.status===filter);if(!rows.length){$('cards').textContent='No matching images found.';return}for(const r of rows.slice().reverse()){const card=document.createElement('article');card.className='item';if(['FAIL','REVIEW'].includes(r.status)&&r.outputPath){const img=document.createElement('img');img.loading='lazy';img.src='/api/thumbnail/'+encodeURIComponent(r.id);img.alt='Thumbnail of '+r.fileName;card.append(img)}const body=document.createElement('div');body.className='body';const name=document.createElement('p');name.className='name';name.textContent=r.fileName;const status=document.createElement('span');status.className='pill '+r.status;status.textContent=r.status;const score=document.createElement('p');score.textContent='Quality score: '+(r.score??'N/A')+' / 100';const path=document.createElement('p');path.className='small';path.textContent=r.relativePath;const issues=document.createElement('p');issues.textContent=(r.issues||[]).join('; ')||'No reported issues';const explanation=document.createElement('p');explanation.className='small';explanation.textContent=r.explanation||'';body.append(name,status,score,path,issues,explanation);card.append(body);$('cards').append(card)}}
async function refresh(){try{const res=await fetch('/api/report');if(!res.ok)throw Error('Could not load report');report=await res.json();$('message').textContent='';render()}catch(e){$('message').textContent=e.message}}$('refresh').onclick=refresh;$('filter').onchange=render;refresh();setInterval(refresh,12000);
</script></body></html>
